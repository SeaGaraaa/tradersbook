<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Trader'sBook</title>
  <meta name="description" content="Trader'sBook — торговый журнал на Google Sheets">
  <meta name="theme-color" content="#0c0c0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Trader'sBook">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/tb-icon-192.png">
  <link rel="apple-touch-icon" href="icons/tb-apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
  <script>
    // тема и язык до отрисовки — без мигания
    try {
      document.documentElement.dataset.theme = localStorage.getItem("tj.theme") === "light" ? "light" : "dark";
      document.documentElement.lang = localStorage.getItem("tj.lang") === "en" ? "en" : "ru";
    } catch (e) { document.documentElement.dataset.theme = "dark"; }
  </script>
</head>
<body>
  <div id="gate" class="gate" hidden></div>

  <div id="app" hidden>
    <header class="top">
      <div class="brand"><span class="logo sm"></span><span>Trader'sBook</span><span class="spinner" aria-hidden="true"></span></div>
      <nav class="tabs">
        <button class="tab" data-view="journal"><svg viewBox="0 0 24 24" class="tab-i" aria-hidden="true"><path d="M2 4.5A1.5 1.5 0 0 1 3.5 3H9a3 3 0 0 1 3 3v15a2.5 2.5 0 0 0-2.5-2.5H3.5A1.5 1.5 0 0 1 2 17V4.5z"/><path d="M22 4.5A1.5 1.5 0 0 0 20.5 3H15a3 3 0 0 0-3 3v15a2.5 2.5 0 0 1 2.5-2.5h6a1.5 1.5 0 0 0 1.5-1.5V4.5z"/></svg><span class="tab-l" data-i18n="Журнал">Журнал</span></button>
        <button class="tab" data-view="dashboard"><svg viewBox="0 0 24 24" class="tab-i" aria-hidden="true"><rect x="3" y="3" width="7.5" height="9" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="5" rx="1.5"/><rect x="13.5" y="11" width="7.5" height="10" rx="1.5"/><rect x="3" y="15" width="7.5" height="6" rx="1.5"/></svg><span class="tab-l">Dashboard</span></button>
        <button class="tab" data-view="stats"><svg viewBox="0 0 24 24" class="tab-i" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span class="tab-l" data-i18n="Статистика">Статистика</span></button>
        <button class="tab" data-view="checklist"><svg viewBox="0 0 24 24" class="tab-i" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 12.5l2.5 2.5L16 9.5"/></svg><span class="tab-l" data-i18n="Чек-лист">Чек-лист</span></button>
        <button class="tab" data-view="strategy"><svg viewBox="0 0 24 24" class="tab-i" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/></svg><span class="tab-l" data-i18n="Стратегия">Стратегия</span></button>
        <button class="tab" data-view="news"><svg viewBox="0 0 24 24" class="tab-i" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg><span class="tab-l" data-i18n="Новости">Новости</span></button>
        <button class="tab" data-view="lot"><svg viewBox="0 0 24 24" class="tab-i" aria-hidden="true"><rect x="5" y="2.5" width="14" height="19" rx="2.5"/><path d="M8.5 6.5h7"/><path d="M8.5 11h.01M12 11h.01M15.5 11h.01M8.5 14.5h.01M12 14.5h.01M15.5 14.5h.01M8.5 18h.01M12 18h.01M15.5 18h.01"/></svg><span class="tab-l has-s" data-i18n="Калькулятор лота">Калькулятор лота</span><span class="tab-s" data-i18n="Лот">Лот</span></button>
      </nav>
      <div class="actions">
        <button class="btn ghost icon api-btn" id="apiBtn" data-i18n-title="API: биржи и торговые счета" title="API: биржи и торговые счета">API</button>
        <button class="btn ghost icon lang" id="lang" data-i18n-title="Язык: русский / английский" title="Язык: русский / английский">EN</button>
        <button class="btn ghost icon" id="theme" data-i18n-title="Тема: светлая / тёмная" title="Тема: светлая / тёмная">
          <svg viewBox="0 0 24 24" class="i-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg viewBox="0 0 24 24" class="i-moon"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
        <button class="btn ghost icon" id="refresh" data-i18n-title="Обновить" title="Обновить" aria-label="Обновить">
          <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button>
        <button class="btn ghost icon" id="logout" data-i18n-title="Выйти" title="Выйти" aria-label="Выйти">
          <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg></button>
      </div>
    </header>
    <div id="newsBar" class="news-bar" hidden></div>
    <main id="view"></main>
    <button id="fab" class="fab" aria-label="Новая сделка">+</button>
  </div>

  <div id="editor" class="editor" hidden></div>
  <div id="viewer" class="viewer" hidden></div>
  <div id="toast" class="toast" role="status"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
