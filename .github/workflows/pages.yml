# Публикация приложения на GitHub Pages + календарь Forex Factory раз в час (вкладка «Новости»).
name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "4 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Календарь Forex Factory
        run: python3 scripts/ff_calendar.py calendar.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
